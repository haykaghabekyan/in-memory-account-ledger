name: Intentionally failing test

# DesignLimitationTest fails on purpose (see README "The intentionally failing test"), so this
# workflow is expected to fail on every run. Its log shows the assertion failure. The main
# Build and test workflow excludes this test and stays green.

on:
  push:
  pull_request:

jobs:
  design-limitation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run DesignLimitationTest (fails on purpose)
        run: mvn -B test -Dtest=DesignLimitationTest -DexcludedTestGroups=
